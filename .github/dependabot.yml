# Dependabot opens a PR when a pinned version has a new release.
# The pip entry covers requirements.txt and requirements-dev.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - AlexHeavens
  # Dockerfiles in pins/ only record a release tag (for example gitleaks).
  - package-ecosystem: docker
    directories:
      - /pins/*
    schedule:
      interval: weekly
    assignees:
      - AlexHeavens
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    assignees:
      - AlexHeavens
